name: Config check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Neovim reads its config from $XDG_CONFIG_HOME/nvim on every OS
      XDG_CONFIG_HOME: ${{ github.workspace }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: nvim

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Create a test Godot project
        run: |
          mkdir -p "$RUNNER_TEMP/game/scripts"
          cd "$RUNNER_TEMP/game"
          echo 'config_version=5' > project.godot
          printf 'extends Node\n\nfunc _ready():\n\tpass\n' > scripts/player.gd
          printf 'import os\n' > test.py
          printf '# hi\n' > test.md
          printf 'local x = 1\n' > test.lua

      - name: Start the config and run checks
        working-directory: ${{ runner.temp }}/game/scripts
        timeout-minutes: 20
        run: nvim --headless player.gd -c "luafile $XDG_CONFIG_HOME/nvim/.github/ci/check.lua"

      - name: Godot wrapper opens files in the running instance (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}/game
        run: |
          nvim --headless &
          for i in $(seq 1 30); do [ -S /tmp/godot.pipe ] && break; sleep 1; done
          "$XDG_CONFIG_HOME/nvim/scripts/godot-nvim.sh" "$PWD/scripts/player.gd" 3 2
          sleep 1
          result=$(nvim --server /tmp/godot.pipe --remote-expr 'expand("%:t") . " " . line(".") . ":" . col(".")')
          echo "$result"
          nvim --server /tmp/godot.pipe --remote-send ':qa!<CR>' || true
          [ "$result" = "player.gd 3:2" ]
